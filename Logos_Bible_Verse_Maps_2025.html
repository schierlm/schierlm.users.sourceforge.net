<script type="text/javascript">
"use strict";

var books = [];

function updateVerseMaps() {
	let checkboxes = document.querySelectorAll(".mapselect input"), selMaps = [];
	for(let input of checkboxes) {
		if (input.checked) {
			selMaps.push(input.name);
		}
	}
	document.getElementById("mapselectsummary").innerText = selMaps.length +" of "+ checkboxes.length+" versemaps selected";
	let toc = document.getElementById("toc");
	let cnt = document.getElementById("content");
	toc.innerHTML = cnt.innerHTML = '';
	for(let bk of books) {
		let visibleCols = Array(bk.h.length), anyColVisible = false;
		visibleCols.fill(false);
		for(let i = 0; i < bk.h.length; i++) {
			for(let map of bk.h[i]) {
				if (selMaps.includes(map)) {
					visibleCols[i] = true;
					anyColVisible = true;
					break;
				}
			}
		}
		if (!anyColVisible) {
			continue;
		}
		let li = document.createElement("li");
		li.innerHTML = '<a href="#Book-' + bk.n + '">' + bk.n + '</a>';
		toc.appendChild(li);
		let h2 = document.createElement("h2");
		h2.id = "Book-" + bk.n;
		h2.innerHTML = bk.n;
		cnt.appendChild(h2);
		let tbl = document.createElement("table");
		let ths = document.createElement("tr");
		tbl.appendChild(ths);
		let thl = document.createElement("th");
		thl.classList.add("left");
		ths.appendChild(thl);
		for(let i = 0; i < bk.h.length; i++) {
			if (visibleCols[i]) {
				let th = document.createElement("th");
				th.innerText = bk.h[i].filter(v => selMaps.includes(v)).join(", ");
				ths.appendChild(th);
			}
		}
		for (let row of bk.r) {
			let tr = document.createElement("tr");
			tbl.appendChild(tr);
			let tl = document.createElement("td");
			tl.classList.add("left");
			tl.innerText = row[0];
			tr.appendChild(tl);
			for( let i = 0; i < bk.h.length; i++) {
				if (visibleCols[i]) {
					let td = document.createElement("td");
					if (row[i+1] != row[1]) td.classList.add("diff");
					td.onclick = function() {
						filterRow(bk.h, row, row[i+1]);
					};
					td.innerText = row[i+1];
					tr.appendChild(td);
				}
			}
		}
		cnt.appendChild(tbl);
	}
}

function filterRow(hdr, row, value) {
	let correctMaps = [];
	for(let i = 0; i<row.length - 1; i++) {
		if (row[i+1] == value) {
			correctMaps.push(...hdr[i]);
		}
	}
	for(let input of document.querySelectorAll(".mapselect input")) {
		if (input.checked && !correctMaps.includes(input.name)) {
			input.checked = false;
		}
	}
	updateVerseMaps();
}

function selectMaps(all) {
	for(let input of document.querySelectorAll(".mapselect input")) {
		input.checked = all;
	}
	updateVerseMaps();
}

window.onload = function() {
	let data = document.getElementById("versemapdata").textContent.split("\n");
	let letters = data[0];
	let versemaps = data[1].split(",");
	for(let map of versemaps) {
		let p = document.createElement("label");
		p.innerHTML = '<input type="checkbox" name="' + map + '" checked onclick="updateVerseMaps();"> ' + map;
		document.getElementById("mapselectboxes").appendChild(p);
	}
	if (data[2] != '') throw data[2];
	let lino = 3;
	while (lino < data.length) {
		let bk = {n: data[lino], h: [], r: []};
		let cols = data[lino+1];
		books.push(bk);
		lino += 2;
		let vmap = 0, lastCol = -1;
		while (cols != '') {
			let col = letters.indexOf(cols[0]);
			if (col != -1) {
				lastCol = col;
				while (col >= bk.h.length) bk.h.push([]);
				bk.h[col].push(versemaps[vmap]);
				vmap++;
				cols = cols.substring(1);
			} else if (cols[0] == '-') {
				lastCol = -2;
				vmap++;
				cols = cols.substring(1);
			} else if (lastCol != -1 && cols[0] >= "0" && cols[0] <= "9") {
				let len = 1;
				while (cols[len] >= "0" && cols[len] <= "9") len++;
				let cnt = +cols.substring(0, len);
				if (lastCol != -2) {
					bk.h[lastCol].push(...versemaps.slice(vmap, vmap+cnt-1));
				}
				vmap += cnt - 1;
				cols = cols.substring(len);
			} else {
				throw cols;
			}
		}
		if (vmap != versemaps.length) throw vmap;
		let lastRow = 0;
		while(data[lino] != '') {
			let line = data[lino], row = Array(bk.h.length+1), epos = line.indexOf("=");
			row.fill('');
			row[0] = "" + (++lastRow);
			if (epos != -1) {
				row[0] = line.substring(0, epos);
				line = line.substring(epos + 1);
				if (/^[1-9][0-9]*$/.test(row[0])) {
					lastRow = +row[0];
				} else {
					lastRow = 0;
				}
			}
			while(line != '') {
				let affectedCols = [], affectedVal = '';
				while(line != '') {
					let pos = letters.indexOf(line[0]);
					if (pos == -1)
						break;
					affectedCols.push(pos);
					line = line.substring(1);
				}
				if (affectedCols.length == 0)
					throw "Rule without cols";
				if (line == '')
					throw "Col without value";
				if (line[0] == '[') {
					let pos = line.indexOf(']');
					affectedVal = line.substring(1, pos);
					line = line.substring(pos+1);
				} else {
					let len = 0;
					while (len < line.length && letters.indexOf(line[len]) == -1) len++;
					affectedVal = line.substring(0, len);
					line = line.substring(len);
					if (/^[0-9]+$/.test(affectedVal)) {
						affectedVal = "1-" + affectedVal;
					}
				}
				for(let affectedCol of affectedCols) {
					row[affectedCol+1] = affectedVal;
				}
			}
			bk.r.push(row);
			lino++;
		}
		lino++;
	}
	updateVerseMaps();
};
</script>
</head>
<body>
	<h1>Logos Bible Verse Maps</h1>
	<p>Click on a cell to only select verse maps that follow the versification in this cell.</p>
	<details class="mapselect">
		<summary id="mapselectsummary"></summary>
		<a href="#" onclick="selectMaps(true);">Select all</a> <a href="#" onclick="selectMaps(false);">Select none</a>
		<div id="mapselectboxes"></div>
	</details>
	<h2>Table Of Contents</h2>
	<ul id="toc"></ul>
	<div id="content"></div>
</body>
</html>
