<!DOCTYPE html>
<html>
<meta charset=utf-8>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="ytlink1.webmanifest">
<link rel="shortcut icon" href="https://s.ytimg.com/yts/img/favicon-vfl8qSV2F.ico" type="image/x-icon" >
<link rel="icon" href="https://s.ytimg.com/yts/img/favicon_32-vflOogEID.png" sizes="32x32" >
<link rel="icon" href="https://s.ytimg.com/yts/img/favicon_48-vflVjB_Qk.png" sizes="48x48" >
<link rel="icon" href="https://s.ytimg.com/yts/img/favicon_96-vflW9Ec0w.png" sizes="96x96" >
<link rel="icon" href="https://s.ytimg.com/yts/img/favicon_144-vfliLAfaB.png" sizes="144x144" >
<title id="title">#</title>
<style type="text/css">
body { font-family: Verdana, Arial, Helvetica, sans-serif; }
a { display: flex; justify-content: center; align-items: center; width: 100%; height: 80vh; border: 1px solid black; }
a div {text-align: center;}
</style>
<script type="text/javascript">

window.onload = function() {
	var params = {};
	var pairs = window.location.search.substr(1).split("&");
	for (var p of pairs) {
		var kv = p.split("=");
		params[kv[0]] = unescape(kv[1]);
	}
	if (!params.url) {
		document.body.innerHTML = '<form method="GET">Title:<input type="text" name="title"><br/>Link:<input type="text" name="url"><br/><input type="submit"></form>';
	} else {
		var t = document.getElementById("title");
		var l = document.getElementById("link");
		t.innerHTML = document.getElementById("linktext").innerHTML = params.title;
		l.href = params.url;
		if (window.matchMedia('(display-mode: fullscreen)').matches) {
			window.location.href = params.url;
		}
	}
};
</script>
</head>
<body><a href="#" id="link"><div><img src="https://s.ytimg.com/yts/img/favicon_144-vfliLAfaB.png"><div id="linktext">#</div></div></a></body>
</html>
